<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD de Produtos — Front-end</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Cadastro de Produtos</h1>
      <p>Interface pronta para integrar com a API Express + Prisma + Zod.</p>
    </header>

    <!-- Mensagens de feedback da interface ou da API -->
    <div id="feedback" class="feedback hidden" role="alert" aria-live="polite"></div>

    <!-- Formulário de Criação / Edição -->
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Novo Produto</h2>

      <form id="item-form" novalidate>
        <input type="hidden" id="item-id" name="id" />

        <div class="form-grid">
          <div class="form-group">
            <label for="nome">Nome *</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Ex.: Teclado Mecânico"
              required
            />
          </div>

          <div class="form-group">
            <label for="categoria">Categoria *</label>
            <input
              type="text"
              id="categoria"
              name="categoria"
              placeholder="Ex.: Periféricos"
              required
            />
          </div>

          <div class="form-group">
            <label for="preco">Preço (R$) *</label>
            <input
              type="number"
              id="preco"
              name="preco"
              step="0.01"
              min="0"
              placeholder="199.90"
              required
            />
          </div>

          <div class="form-group">
            <label for="quantidade">Quantidade *</label>
            <input
              type="number"
              id="quantidade"
              name="quantidade"
              step="1"
              min="0"
              placeholder="10"
              required
            />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">
            Salvar
          </button>
          <button type="button" id="cancel-btn" class="btn btn-secondary hidden">
            Cancelar edição
          </button>
        </div>
      </form>
    </section>

    <!-- Listagem de Registros -->
    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">Registros Cadastrados</h2>
        <button type="button" id="refresh-btn" class="btn btn-ghost">
          Atualizar lista
        </button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Categoria</th>
              <th>Preço</th>
              <th>Qtd.</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="items-tbody">
            <tr>
              <td colspan="6" class="empty-state">Carregando registros...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
